<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub</title>
    <link rel="stylesheet" href="Gamehub/CSS/style.css">
</head>
<body>
    <header>
        <h1>GameHub</h1>
        <p>Sua biblioteca de jogos</p>
    </header>
    <main>
        <section>
            <h2>Adicionar jogo</h2>

            <form id="form-jogo">
                <label for="nome-jogo">Nome do jogo:</label>
                <input type="text" id="nome-jogo" placeholder="Digite o nome">

                <button type="submit">Adicionar</button>
            </form>
        </section>

        <section>
            <h2>Pesquisar jogos</h2>

            <label for="pesquisa">Buscar:</label>
            <input type="text" id="pesquisa" placeholder="Pesquise um jogo">
        </section>

        <section>
            <h2>Minha biblioteca</h2>
            <div id="lista-jogos"></div>
            <p id="mensagem"></p>
        </section>
    </main>

    <script src="Gamehub/JavaScript/script.js"></script>
</body>
</html>
